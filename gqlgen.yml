schema:
  - graph/schema.graphqls

exec:
  package: graph
  layout: single-file
  filename: graph/generated.go

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  package: graph
  layout: follow-schema
  dir: graph
  filename_template: "{name}.resolvers.go"

models:
  UUID:
    model: github.com/99designs/gqlgen/graphql.UUID
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  Bookmark:
    model: shelf/db/models.Bookmark
  Tag:
    model: shelf/db/models.Tag
  BookmarkTag:
    model: shelf/db/models.BookmarkTag
  EnrichmentStatus:
    model: shelf/db/models.EnrichmentStatus